# Netlify configuration — Smile Studio of Rehoboth
#
# INDEXING
# ========
# NEXT_PUBLIC_ALLOW_INDEXING is NOT set in this file on purpose. It lives in the
# Netlify dashboard, set to "true" for the PRODUCTION context only (done
# 2026-09-17, once www.rehobothsmiles.com was live and the CRM hand-off was
# verified). Production therefore serves index,follow, a full sitemap.xml, and
# a permissive robots.txt.
#
# Every other context is pinned to "false" below, so deploy previews and
# branch deploys serve:
#   · <meta name="robots" content="noindex, nofollow">
#   · X-Robots-Tag: noindex, nofollow
#   · an empty sitemap.xml
#   · robots.txt with "Disallow: /"
# Keep it that way. A preview URL indexed for the practice's own brand terms
# would compete with the real domain.

# FORMS
# =====
# Netlify Forms is the system of record for both website forms. The forms are
# rendered by React, so Netlify cannot see them; public/__forms.html declares
# them statically so form detection registers "opening-list" and "inquiry" at
# deploy time. The API routes post each validated submission there server-side.
# Email notifications are configured per form in the Netlify UI under
# Forms -> Form notifications. The CRM hand-off is code: Netlify invokes
# netlify/functions/submission-created.ts on every verified submission, and it
# posts the lead to the Freedom Dental Health CRM. It needs CRM_WEBHOOK_SECRET
# and CRM_LOCATION_ID set in the Netlify dashboard.

[build]
  command = "npm run build"
  publish = ".next"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  # NEXT_PUBLIC_SHOW_PLACEHOLDERS is deliberately NOT set here. Production must
  # never render the amber internal notes: www.rehobothsmiles.com is printed on
  # the coming-soon flyer and encoded in its QR code, so a patient can reach
  # this site at any time. Internal notes are scoped to preview contexts below.

# Netlify's Next.js Runtime. Handles the App Router, route handlers,
# static prerendering, and the image CDN.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Deploy Previews and branch deploys must never be indexed either. This is a
# second belt on top of the application-level gate above.
# NEXT_PUBLIC_SHOW_PLACEHOLDERS is now off in EVERY context, production and
# preview alike. The amber internal notes existed so reviewers could see what
# content was still outstanding, but the people reviewing these previews are
# the practice rather than the build team, and the notes read as unfinished
# work on an otherwise finished page. The outstanding list lives in
# docs/REQUIRED-BEFORE-OPENING.md, which is where it belongs.
# Set it to "true" on a branch deploy if a content review ever needs them back.
[context.deploy-preview.build.environment]
  NEXT_PUBLIC_ALLOW_INDEXING = "false"

[context.branch-deploy.build.environment]
  NEXT_PUBLIC_ALLOW_INDEXING = "false"

# Security headers are set by the application in next.config.mjs so that they
# apply identically in local dev, on Netlify, and anywhere else this is hosted.
# They are not duplicated here, to avoid two sources of truth drifting apart.
